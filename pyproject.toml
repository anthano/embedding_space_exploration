[build-system]
build-backend = "hatchling.build"
requires = [ "hatch-vcs", "hatchling" ]

[project]
name = "embedding-space-exploration"
description = "Exploration of embedding spaces"
keywords = [
  "Embeddings",
  "Reproducible Research",
]
requires-python = ">=3.13,<3.14"
classifiers = [
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
]
dynamic = [ "version" ]
[[project.authors]]
name = "anthano"
email = "thanabalasingamanoja@gmail.com"
[project.license]
text = "MIT"
[[project.maintainers]]
name = "anthano"
email = "thanabalasingamanoja@gmail.com"
[project.readme]
content-type = "text/markdown"
file = "README.md"
[project.urls]
Github = "https://github.com/anthano/embedding_space_exploration"
Tracker = "https://github.com/anthano/embedding_space_exploration/issues"

[tool.hatch]
version.source = "vcs"
metadata.allow-direct-references = true
build.hooks.vcs.version-file = "src/embedding_space_exploration/_version.py"
build.targets.sdist.exclude = [ "tests" ]
build.targets.sdist.only-packages = true
build.targets.wheel.only-include = [ "src" ]
build.targets.wheel.sources = [ "src" ]

[tool.pixi.dependencies]
jupyter-book = ">=2.0"
jupyterlab = "*"
# Pin <26 (TEMPORARY): the node 26.x line carries a security backport
# (response-queue-poisoning guard on idle http.Agent sockets) that trips a
# latent node-fetch@2 keep-alive+gzip bug, so mystmd's book-theme favicon fetch
# dies with ERR_STREAM_PREMATURE_CLOSE and the docs build fails. See
# https://github.com/nodejs/node/issues/63989 (fix: PR #64004, merged to main
# 2026-06-20 but not yet in a released 26.x). node 25.9 is unaffected only
# because it predates the backport -- it is EOL (2026-06-01), so move to a fixed
# 26.x and drop this pin as soon as conda-forge ships one.
nodejs = "<26"
numpy = ">=2.4"
pandas = ">=2.2"
# `pip` backs the `install-hf-ehr` task (see [tool.pixi.tasks]).
pip = "*"
plotly = ">=6.5"
pyarrow = "*"
prek = "*"
pygraphviz = "*"
pytask = "*"
pytask-parallel = "*"
pytest = "*"
pytest-cov = "*"
pytest-xdist = "*"
python-kaleido = ">=1.1"
scikit-learn = "*"
scipy = "*"
# From conda-forge, not PyPI: one OpenMP runtime (the PyPI wheel bundles its own
# libomp and clashes with conda's on macOS), and it keeps a future GPU arm
# declarative -- a `gpu` feature pinning `cuda-version` rather than a post-install
# script. Locks the CPU build; add that feature when the target hardware is known.
pytorch = "*"
statsmodels = "*"
[tool.pixi.environments]
docs = { features = [ "docs" ], solve-group = "default" }
[tool.pixi.feature.docs.dependencies]
jupyter-book = ">=2.0"
mystmd = "*"
[tool.pixi.feature.docs.tasks]
docs = { cmd = "jupyter book build --html", cwd = "docs_template/source" }
view-docs = { cmd = "jupyter book start", cwd = "docs_template/source" }
check-urls = { cmd = "jupyter book build --html --check-links --strict", cwd = "docs_template/source" }
recreate-dag = { cmd = "pixi run pytask dag --rank-direction TB --output-path docs_template/source/figures/dag.svg" }
[tool.pixi.pypi-dependencies]
embedding_space_exploration = { path = ".", editable = true }
huggingface_hub = "*"
loguru = "*"
# EHRSHOT arrives as a MEDS extract; meds-reader is the reader for it. It is a
# Bazel-built C++ extension whose wheels stop at cp313 -- the reason this project
# pins python <3.14 (on 3.14 pip falls back to the sdist and dies with "Cannot
# find bazel executable"). Revisit when a cp314 wheel ships.
meds-reader = "*"
omegaconf = "*"
pdbp = "*"
tabulate = "*"
tqdm = "*"
# Pinned to 4.48.2 -- the version the CLMBR model card was validated on. Newer
# 4.5x/5.x break this model at runtime (malformed token_type_ids from the tokenizer,
# and the SDPA attention-masking refactor). Its compiled deps (tokenizers 0.21.x,
# safetensors) ship abi3 wheels, so the pin itself is not what caps the python
# version -- meds-reader is.
transformers = "==4.48.2"
[tool.pixi.tasks]
# hf_ehr provides the `Event` type and `CLMBRTokenizer`. Installed with --no-deps
# because its declared deps are training-only and conflict with this stack; its real
# runtime deps are declared in [tool.pixi.pypi-dependencies]. pixi has no native
# per-package no-deps (prefix-dev/pixi#1417), so this one-off task is the supported
# workaround. Run once after `pixi install`.
install-hf-ehr = { cmd = "pip install --no-deps git+https://github.com/som-shahlab/hf_ehr.git@20847e0f13c4e9097a60461109d5fe1c9314debc", description = "Install hf_ehr (CLMBRTokenizer) without its training-only deps" }
tests = { cmd = "pytest -m 'not integration'", description = "Run the fast tests (excludes `integration`, which loads models)" }
tests-integration = { cmd = "pytest -m integration", description = "Run the integration tests: needs the EHRSHOT extract and downloads gated model weights" }
tests-with-cov = { cmd = "pytest --cov-report=xml --cov=./", description = "Run tests with coverage" }
view-paper = { cmd = "jupyter book start", description = "View the HTML paper in browser" }
[tool.pixi.workspace]
channels = [ "conda-forge" ]
platforms = [ "linux-64", "osx-arm64" ]

[tool.ruff]
fix = true
[tool.ruff.lint]
select = [
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "D",   # pydocstyle
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "I",   # isort
  "NPY", # numpy-specific rules
  "PD",  # pandas-vet
  "PT",  # flake8-pytest-style
  "PTH", # use pathlib
  "RUF", # ruff-specific rules
  "SIM", # flake8-simplify
  "UP",  # pyupgrade
  "W",   # pycodestyle warnings
]
extend-ignore = [
  "D10", # Missing docstrings
]
per-file-ignores."tests/*" = [
  "D",     # Docstrings
  "PD011", # Use `.to_numpy()` instead of `.values`
]
pydocstyle.convention = "google"

[tool.codespell]
ignore-words = ".codespell-ignore-words"
skip = "pixi.lock,.codespell-ignore-words"

[tool.pyproject-fmt]
column_width = 88
max_supported_python = "3.13"
table_format = "long"
collapse_tables = [ "tool.hatch", "tool.pytest", "tool.pytask", "tool.ty" ]
expand_tables = [
  "tool.pixi.dependencies",
  "tool.pixi.environments",
  "tool.pixi.feature.docs.dependencies",
  "tool.pixi.feature.docs.tasks",
  "tool.pixi.pypi-dependencies",
  "tool.pixi.tasks",
  "tool.pixi.workspace",
]

[tool.ty]
src.include = [ "src/", "tests/" ]
# ty resolves third-party imports from this pixi env (the official ty-pre-commit hook
# runs with `--no-project`, so uv neither creates a `.venv` nor resolves deps). Run
# `pixi install` once.
environment.python = ".pixi/envs/default"
rules.ambiguous-protocol-member = "error"
rules.deprecated = "error"
rules.division-by-zero = "error"
rules.ignore-comment-unknown-rule = "error"
rules.ineffective-final = "error"
rules.invalid-enum-member-annotation = "error"
rules.invalid-ignore-comment = "error"
rules.invalid-legacy-positional-parameter = "error"
rules.possibly-missing-submodule = "error"
rules.redundant-cast = "error"
rules.unused-awaitable = "error"
rules.unused-ignore-comment = "error"

[tool.pytest]
ini_options.norecursedirs = [ "docs" ]
ini_options.addopts = "--pdbcls=pdbp:Pdb"
ini_options.markers = [
  "end_to_end: Flag for tests that cover the whole program.",
  "integration: Flag for integration tests which may comprise of multiple unit tests.",
  "unit: Flag for unit tests which target mainly a single function.",
  "wip: Tests that are work-in-progress.",
]
ini_options.filterwarnings = []

[tool.yamlfix]
line_length = 88
none_representation = "null"
preserve_quotes = true
sequence_style = "block_style"

[tool.pytask]
ini_options.paths = [ "./src/embedding_space_exploration", "./documents" ]
ini_options.pdbcls = "pdbp:Pdb"
